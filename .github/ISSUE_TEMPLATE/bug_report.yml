name: Bug report / Помилка
description: Something doesn't work — you can write in English or Ukrainian
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Holos version
      description: "Tray icon menu → first line (e.g. «Стан: … · v0.4.0»)"
      placeholder: v0.4.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows and graphics card
      placeholder: Windows 11, NVIDIA RTX 3060 / no dedicated GPU
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
      description: Steps to reproduce, if you know them.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: "Tray menu → error log (Журнал помилок). Paste the last lines. Your dictated text is never written there."
      render: text
