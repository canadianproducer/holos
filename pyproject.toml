[project]
name = "holos"
dynamic = ["version"]
description = "Offline dictation and read-aloud for Windows, Ukrainian-first"
readme = "README.md"
license = "GPL-3.0-only"
authors = [{ name = "Oleksandr Potapenko (Canadian Producer)" }]
requires-python = ">=3.11,<3.12"

[project.urls]
Homepage = "https://github.com/canadianproducer/holos"
Issues = "https://github.com/canadianproducer/holos/issues"
Changelog = "https://github.com/canadianproducer/holos/blob/main/CHANGELOG.md"

# An application, not a library: packaged by PyInstaller (holos.spec). This file only configures the tools.

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["app", "tests", "tools"]
extend-exclude = [".build", "build", "dist", "dist-release"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S"]
ignore = [
  "E501",   # line length is handled by the formatter; long UI strings stay as they are
  "S101",   # assert in tests
  "S110",   # try/except/pass is deliberate around sounds/clipboard (must never break dictation)
  "S603",   # subprocess with fixed arguments (update installer)
  "S310",   # urlopen: only https:// and the local Ollama, enforced in code
]

[tool.ruff.lint.isort]
known-first-party = ["common", "stt", "tts", "cleanup", "cuda_pack", "download_models", "holos", "hotkeys", "updater", "winutil"]

[tool.ruff.lint.per-file-ignores]
"holos.spec" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
addopts = "-q"
